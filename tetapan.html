<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Settings — Fire Extinguisher Locator</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#7A1913" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root { --merah:#B3261E; --merah-terang:#D4291F; --merah-gelap:#7A1913; --emas:#C99A2E; --emas-terang:#E5BE5E;
    --gelap:#1B1B1B; --malap:#7A7A7A; --garis:#EFEAE6; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#fff; color:var(--gelap); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  a,button { text-decoration:none; color:inherit; font-family:inherit; }
  #app { max-width:480px; margin:0 auto; min-height:100%; padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  header { background:linear-gradient(160deg, var(--merah-terang), var(--merah-gelap)); padding:16px 18px 20px;
    display:flex; align-items:center; gap:12px; }
  header a.balik { flex:none; width:34px; height:34px; border-radius:10px; background:rgba(0,0,0,.18);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; }
  header h1 { color:#fff; font-size:16px; margin:0; font-weight:800; letter-spacing:.3px; }
  main { padding:20px 18px 10px; }
  .kump-tajuk { font-size:11.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--malap); margin:18px 2px 8px; }
  .senarai-tetapan { background:#F8F6F4; border:1px solid var(--garis); border-radius:14px; overflow:hidden; }
  .baris { width:100%; display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; background:none;
    border-bottom:1px solid var(--garis); font-size:13.5px; text-align:left; cursor:pointer; }
  .baris:last-child { border-bottom:none; }
  .baris .ikon { flex:none; width:34px; height:34px; border-radius:9px; background:rgba(179,38,30,.1);
    display:flex; align-items:center; justify-content:center; color:var(--merah); }
  .baris .teks { flex:1; }
  .baris .teks b { display:block; font-weight:700; }
  .baris .teks small { display:block; color:var(--malap); font-size:11px; margin-top:1px; }
  #status-msg { font-size:11.5px; color:#1E7B45; text-align:center; margin-top:8px; min-height:16px; }
  #nav-bawah { position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; display:flex;
    background:linear-gradient(180deg, var(--merah-terang), var(--merah-gelap));
    padding:8px 4px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -4px 14px rgba(0,0,0,.18); z-index:20; }
  #nav-bawah a { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px;
    color:rgba(255,255,255,.65); font-size:10.5px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; position:relative; }
  #nav-bawah a.aktif { color:var(--emas-terang); }
  #nav-bawah a.aktif::before { content:""; position:absolute; top:-8px; width:24px; height:3px; border-radius:3px; background:var(--emas-terang); }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="index.html" class="balik" aria-label="Kembali">←</a>
    <h1>Settings</h1>
  </header>

  <main>
    <div class="kump-tajuk">Aplikasi</div>
    <div class="senarai-tetapan">
      <a class="baris" href="tentang.html">
        <span class="ikon">ℹ️</span>
        <span class="teks"><b>About App</b><small>Maklumat &amp; versi aplikasi</small></span>
      </a>
      <a class="baris" href="panduan.html">
        <span class="ikon">🧯</span>
        <span class="teks"><b>Safety Guide</b><small>Panduan keselamatan kebakaran</small></span>
      </a>
    </div>

    <div class="kump-tajuk">Data Luar Talian</div>
    <div class="senarai-tetapan">
      <button class="baris" id="btn-segar">
        <span class="ikon">↺</span>
        <span class="teks"><b>Muat Semula Data Pelan</b><small>Kemas kini cache pelan lantai &amp; senarai pemadam</small></span>
      </button>
    </div>

    <div class="kump-tajuk">Alat Pembangun</div>
    <div class="senarai-tetapan">
      <a class="baris" href="editor.html">
        <span class="ikon">🛠️</span>
        <span class="teks"><b>Editor Laluan &amp; Alat</b><small>Bina data nod, laluan &amp; alat pemadam untuk tingkat baharu</small></span>
      </a>
    </div>
    <div id="status-msg"></div>
  </main>

  <nav id="nav-bawah">
    <a href="index.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a>
    <a href="blok.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-13a7 7 0 1 0-14 0c0 5.42 7 13 7 13Z"/><circle cx="12" cy="9" r="2.4"/></svg>Map</a>
    <a href="panduan.html"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3.4v5.7c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6.4Z"/><path d="M8.7 12.2l2.3 2.3 4.4-4.7"/></svg>Guide</a>
    <a href="tetapan.html" class="aktif"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
  </nav>
</div>

<script>
document.getElementById('btn-segar').addEventListener('click', async () => {
  const msg = document.getElementById('status-msg');
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) await r.unregister();
  }
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  msg.textContent = 'Cache dikosongkan. Memuat semula...';
  setTimeout(() => location.reload(), 700);
});
</script>
</body>
</html>
